<div class="position-relative" [ngClass]="{'dvh-100 overflow-hidden':loadingData()!='loaded'}">

    <div class="d-flex flex-column justify-content-center align-items-center position-absolute bg-custom z-2 w-100"
        style="transition: height 1s" [ngStyle]="{'height': loadingData()=='loaded'? '0dvh' : '100dvh' }">
        @if(loadingData()=='failed'){
        <div>OOPS !!</div>
        <div class="text-x-small opacity-75">Stay tuned</div>
        }
        @else if(loadingData()=='loading'){
        <div style="width: 47px; height: 62px;">
            <div class="loader"></div>
        </div>
        <div class="opacity-75 text-small">{{currentStatus()}}</div>
        }
    </div>

    <div [ngStyle]="{'margin-top': stateService.navHeight()+10+'px'}" class="container-fluid">
        <img [src]="selected().url" class="img-fluid" loading="lazy" (load)="loadingData.set('loaded')" />

        <div class="d-flex mt-2 gap-2 justify-content-between">
            <div class="border rounded p-2 text-small d-flex align-items-center">
                <div (click)="downloadImage(selected())">Download</div>
            </div>
            @if(selected().location.length!=0){
            <div class="border rounded-pill p-2 pe-3 text-small d-flex align-items-center gap-2">
                <div>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier">
                            <path
                                d="M12 21C15.5 17.4 19 14.1764 19 10.2C19 6.22355 15.866 3 12 3C8.13401 3 5 6.22355 5 10.2C5 14.1764 8.5 17.4 12 21Z"
                                stroke="#04dc13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path
                                d="M12 13C13.6569 13 15 11.6569 15 10C15 8.34315 13.6569 7 12 7C10.3431 7 9 8.34315 9 10C9 11.6569 10.3431 13 12 13Z"
                                stroke="#04dc13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </g>
                    </svg>
                </div>
                {{selected().location}}
            </div>
            }
        </div>

        <div class="mt-3">
            @if(selected().description){
            @for (item of selected().description.split(";"); track $index) {
            <div class="mb-1">{{item}}</div>
            }
            }
        </div>
    </div>
</div>
