@if(isLargeScreen()){
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="text-center">
        <div>
            Desktop version coming soon
        </div>
        <div class="text-small text-muted">
            Use developer tools to emulate mobile device for mobile version
        </div>
        <div class="text-x-small text-muted">
            Use (Ctrl + Shift + I) and then (Ctrl + Shift + M) and refresh
        </div>
    </div>
</div>
}
@if(isNavigating()){
<div class="top-loader"></div>
}
<main [ngClass]="{'hidden-background':isLargeScreen()}">
    <router-outlet />
</main>
